name = "tiktok-broker-worker"
main = "worker.js"
compatibility_date = "2026-09-01"

[triggers]
crons = [ "*/5 * * * *" ] # Run every 5 minutes 100% FREE

[vars]
TIKTOK_CHANNEL = "@broker_username"

# Cloudflare Workers AI integration for Whisper STT (Free Tier: 10,000 neurons/day)
[ai]
binding = "AI"
